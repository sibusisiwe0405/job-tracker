<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      
      <span class="logo-text">JobTrack</span>
    </div>
    <nav>
      <a href="#" class="nav-item active" onclick="setActiveNavItem(this, 'All')">Dashboard</a>
      <a href="#" class="nav-item" onclick="showAddForm()">Add Application</a>
      <a href="#" class="nav-item" onclick="setActiveNavItem(this, 'Interview')">Interviews</a>
      <a href="#" class="nav-item" onclick="setActiveNavItem(this, 'Offer')">Offers</a>
      <a href="#" class="nav-item" onclick="setActiveNavItem(this, 'Rejected')">Rejected</a>
    </nav>
    <div class="sidebar-footer">
      <p>Built by Sibusisiwe</p>
    </div>
  </aside>
 
  <main class="main">

    <!-- Header -->
    <div class="header">
      <div>
        <h1>My Applications</h1>
        <p class="subtitle">Track every opportunity in one place</p>
      </div>
      <button class="btn-primary" onclick="showAddForm()">+ Add Application</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <p class="stat-label">Total</p>
        <p class="stat-number" id="stat-total">0</p>
      </div>
      <div class="stat-card applied">
        <p class="stat-label">Applied</p>
        <p class="stat-number" id="stat-applied">0</p>
      </div>
      <div class="stat-card interview">
        <p class="stat-label">Interviews</p>
        <p class="stat-number" id="stat-interview">0</p>
      </div>
      <div class="stat-card offer">
        <p class="stat-label">Offers</p>
        <p class="stat-number" id="stat-offer">0</p>
      </div>
      <div class="stat-card rejected">
        <p class="stat-label">Rejected</p>
        <p class="stat-number" id="stat-rejected">0</p>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterApplications('All', this)">All</button>
      <button class="filter-btn" onclick="filterApplications('Applied', this)">Applied</button>
      <button class="filter-btn" onclick="filterApplications('Interview', this)">Interview</button>
      <button class="filter-btn" onclick="filterApplications('Offer', this)">Offer</button>
      <button class="filter-btn" onclick="filterApplications('Rejected', this)">Rejected</button>
    </div>

    <!-- Applications List -->
    <div class="applications-grid" id="applications-grid">
      <p class="empty-state" id="empty-state">No applications yet. Add your first one!</p>
    </div>

  </main>

  <!-- Modal -->
  <!-- Edit/Add Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-title">Add Application</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id" />
      <div class="form-group">
        <label>Company *</label>
        <input type="text" id="company" placeholder="e.g. Google" />
      </div>
      <div class="form-group">
        <label>Role *</label>
        <input type="text" id="role" placeholder="e.g. Junior Backend Developer" />
      </div>
      <div class="form-group">
        <label>Job URL</label>
        <input type="text" id="jobUrl" placeholder="https://..." />
      </div>
      <div class="form-group" id="status-group" style="display:none">
        <label>Status</label>
        <select id="status" onchange="toggleInterviewFields()">
          <option value="Applied">Applied</option>
          <option value="Interview">Interview</option>
          <option value="Offer">Offer</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="notes" placeholder="Any notes about this application..."></textarea>
      </div>

      <!-- Interview Fields -->
      <div id="interview-fields" style="display:none">
        <div class="section-divider">Interview Details</div>
        <div class="form-group">
          <label>Interview Type</label>
          <select id="interview-type">
            <option value="">Select type</option>
            <option value="Remote">Remote</option>
            <option value="On-site">On-site</option>
            <option value="Hybrid">Hybrid</option>
          </select>
        </div>
        <div class="form-group">
          <label>Interview Date & Time</label>
          <input type="datetime-local" id="interview-date" />
        </div>
        <div class="form-group">
          <label>Interview Round</label>
          <select id="interview-round">
            <option value="">Select round</option>
            <option value="First Round">First Round</option>
            <option value="Second Round">Second Round</option>
            <option value="Final Round">Final Round</option>
          </select>
        </div>
        <div class="form-group">
          <label>Interviewer / Panel</label>
          <input type="text" id="interview-interviewer" placeholder="e.g. John Smith, HR Team" />
        </div>
        <div class="form-group">
          <label>Interview Notes</label>
          <textarea id="interview-notes" placeholder="Preparation notes, topics to cover..."></textarea>
        </div>
     </div>

      <!-- Offer Fields -->
      <div id="offer-fields" style="display:none">
        <div class="section-divider">Offer Details</div>
        <div class="form-row">
          <div class="form-group">
            <label>Salary Amount</label>
            <input type="number" id="offer-salary" placeholder="e.g. 25000" />
          </div>
          <div class="form-group">
            <label>Currency</label>
            <select id="offer-currency">
              <option value="ZAR">ZAR</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Work Type</label>
          <select id="offer-worktype">
            <option value="">Select type</option>
            <option value="Remote">Remote</option>
            <option value="Hybrid">Hybrid</option>
            <option value="On-site">On-site</option>
          </select>
        </div>
        <div class="form-group">
          <label>Contract Type</label>
          <select id="offer-contracttype">
            <option value="">Select type</option>
            <option value="Permanent">Permanent</option>
            <option value="Contract">Contract</option>
            <option value="Part-time">Part-time</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="offer-startdate" />
          </div>
          <div class="form-group">
            <label>Offer Deadline</label>
            <input type="date" id="offer-deadline" />
          </div>
        </div>
        <div class="form-group">
          <label>Benefits</label>
          <input type="text" id="offer-benefits" placeholder="e.g. Medical aid, 20 days leave" />
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="offer-notes" placeholder="Any additional notes about the offer..."></textarea>
        </div>
      </div>

      <button class="btn-primary full-width" onclick="saveApplication()">Save Application</button>   
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-overlay" onclick="closeDetailModal()">
  <div class="modal modal-large" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2 id="detail-company"></h2>
        <p id="detail-role" style="color:#666; font-size:14px; margin-top:4px;"></p>
      </div>
      <button class="close-btn" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="detail-body">
    </div>
  </div>
</div>

  <script src="app.js"></script>
</body>
</html>
