<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      
      <span class="logo-text">JobTrack</span>
    </div>
    <nav>
      <a href="#" class="nav-item active">Dashboard</a>
      <a href="#" class="nav-item" onclick="showAddForm()">Add Application</a>
    </nav>
    <div class="sidebar-footer">
      <p>Built by Sibusisiwe</p>
    </div>
  </aside>
 
  <main class="main">

    <!-- Header -->
    <div class="header">
      <div>
        <h1>My Applications</h1>
        <p class="subtitle">Track every opportunity in one place</p>
      </div>
      <button class="btn-primary" onclick="showAddForm()">+ Add Application</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <p class="stat-label">Total</p>
        <p class="stat-number" id="stat-total">0</p>
      </div>
      <div class="stat-card applied">
        <p class="stat-label">Applied</p>
        <p class="stat-number" id="stat-applied">0</p>
      </div>
      <div class="stat-card interview">
        <p class="stat-label">Interviews</p>
        <p class="stat-number" id="stat-interview">0</p>
      </div>
      <div class="stat-card offer">
        <p class="stat-label">Offers</p>
        <p class="stat-number" id="stat-offer">0</p>
      </div>
      <div class="stat-card rejected">
        <p class="stat-label">Rejected</p>
        <p class="stat-number" id="stat-rejected">0</p>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterApplications('All', this)">All</button>
      <button class="filter-btn" onclick="filterApplications('Applied', this)">Applied</button>
      <button class="filter-btn" onclick="filterApplications('Interview', this)">Interview</button>
      <button class="filter-btn" onclick="filterApplications('Offer', this)">Offer</button>
      <button class="filter-btn" onclick="filterApplications('Rejected', this)">Rejected</button>
    </div>

    <!-- Applications List -->
    <div class="applications-grid" id="applications-grid">
      <p class="empty-state" id="empty-state">No applications yet. Add your first one!</p>
    </div>

  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">Add Application</h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label>Company *</label>
          <input type="text" id="company" placeholder="e.g. Google" />
        </div>
        <div class="form-group">
          <label>Role *</label>
          <input type="text" id="role" placeholder="e.g. Junior Backend Developer" />
        </div>
        <div class="form-group">
          <label>Job URL</label>
          <input type="text" id="jobUrl" placeholder="https://..." />
        </div>
        <div class="form-group" id="status-group" style="display:none">
          <label>Status</label>
          <select id="status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="notes" placeholder="Any notes about this application..."></textarea>
        </div>
        <button class="btn-primary full-width" onclick="saveApplication()">Save Application</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
